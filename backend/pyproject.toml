[project]
name = "fdi"
version = "0.1.0"
description = "Financial Document Intelligence — ingestion platform"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.139",
    "uvicorn[standard]>=0.35",
    "pydantic>=2.13",
    "pydantic-settings>=2.14",
    "sqlalchemy[asyncio]>=2.0.51",
    "asyncpg>=0.31",
    "alembic>=1.18",
    "celery>=5.6.3",
    # Celery's own transport library, and what apply_async dials underneath.
    # Declared explicitly because `fdi.platform.broker.health` imports it
    # directly: `api` may not import `fdi.workers` to ask the broker anything,
    # so /ready probes the transport itself. An undeclared transitive dep is a
    # dependency you have without a version constraint on it.
    "kombu>=5.6.2",
    "redis>=5.2",
    "minio>=7.2.20",
    "structlog>=26.1",
    "python-multipart>=0.0.32",
    "azure-ai-documentintelligence>=1.0.2",
    "openai>=2.46.0",
    "neo4j>=5.26",
    "pymilvus>=2.6",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
    "ruff>=0.8",
    "mypy>=1.13",
    "import-linter>=2.13",
    "testcontainers[postgres,minio,rabbitmq,redis]==4.14.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fdi"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "C4", "SIM"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body",
    "fastapi.File", "fastapi.Form",
]

[tool.mypy]
python_version = "3.13"
strict = true
ignore_missing_imports = true
mypy_path = "src"
# Without this, mypy uses pydantic's @dataclass_transform typing, which treats every
# field lacking a default as a mandatory __init__ kwarg -- so a bare `Settings()`, the
# only way this app ever constructs it, reports 6 false `call-arg` errors. The plugin
# special-cases BaseSettings subclasses (`force_optional=... or is_settings` in
# pydantic/mypy.py) because their fields are populated from the environment at runtime.
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: needs Docker containers",
    "e2e: needs the compose stack running",
    "azure: needs live Azure credentials (Document Intelligence and/or OpenAI)",
    "neo4j: needs a live Neo4j instance (FDI_NEO4J_URI/FDI_NEO4J_PASSWORD, or testcontainers[neo4j])",
]
