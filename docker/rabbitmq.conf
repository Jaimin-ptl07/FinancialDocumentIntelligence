# consumer_timeout: milliseconds. Default 1800000 (30 min).
#
# Currently INERT, kept deliberately. RabbitMQ 4.3 stopped evaluating consumer
# timeouts for classic queues -- it is now quorum-queue-only -- and Celery declares
# classic queues by default. So the 30-minute-requeue trap does not exist on this
# stack today.
#
# It costs nothing and becomes load-bearing the moment quorum queues are adopted
# (the HA path, since 4.x dropped classic mirrored queues). A 500-page annual
# report can exceed 30 minutes of CPU; with task_acks_late that would mean the
# channel is killed, the message requeued, and the CPU burned again -- forever.
#
# Enforcement is evaluated at one-minute intervals; sub-five-minute values are
# discouraged. 3 hours:
consumer_timeout = 10800000

loopback_users.guest = false

# RabbitMQ 4.x DENIES transient non-exclusive queues by default -- a feature it
# deprecated. Celery declares exactly those for its remote-control "pidbox"
# broadcast queues (worker mingle/gossip at boot, and `celery inspect ping`, which
# is this stack's worker healthcheck). With the 4.x default the worker crash-loops
# at startup:
#   amqp.exceptions.InternalError: Queue.declare: (541) INTERNAL_ERROR -
#   Feature `transient_nonexcl_queues` is deprecated. By default, this feature is
#   not permitted anymore.
# -> billiard RestartFreqExceeded, and NOT ONE job is ever consumed. No test caught
# this because every worker test calls the task directly or via .apply() (in-process
# eager) -- none run a real worker against a real 4.x broker, which the compose
# round-trip is the first thing to do. Re-permit the feature so Celery 5.6.3 runs
# against RabbitMQ 4.3.2. (Removable once Celery declares durable/quorum pidbox
# queues, or if the broker is pinned below 4.0.)
deprecated_features.permit.transient_nonexcl_queues = true
