name: fdi

# This allowlist MUST contain every Settings field, or the field is inert: the var
# is set in .env, never reaches the container, and the app silently uses its
# default. That is the same silent-misbehaviour class the config validator exists
# to prevent, arriving through Compose instead of through os.environ -- and the
# validator cannot catch it, because it only sees what is already inside the
# container. Add a Settings field, add it here.
x-backend-env: &backend-env
  FDI_DATABASE_URL: ${FDI_DATABASE_URL}
  FDI_BROKER_URL: ${FDI_BROKER_URL}
  FDI_RESULT_BACKEND: ${FDI_RESULT_BACKEND}
  FDI_S3_ENDPOINT: ${FDI_S3_ENDPOINT}
  # Host-reachable endpoint used ONLY for presigning download URLs. FDI_S3_ENDPOINT
  # (minio:9000) is an in-network name a host browser cannot resolve, so a presigned
  # artifact_url signed with it is dead in the address bar. This signs URLs a host
  # can fetch. A Settings field, so it MUST live in this allowlist.
  FDI_S3_PUBLIC_ENDPOINT: ${FDI_S3_PUBLIC_ENDPOINT}
  FDI_S3_ACCESS_KEY: ${FDI_S3_ACCESS_KEY}
  FDI_S3_SECRET_KEY: ${FDI_S3_SECRET_KEY}
  FDI_S3_BUCKET: ${FDI_S3_BUCKET}
  FDI_S3_SECURE: ${FDI_S3_SECURE}
  FDI_LOG_LEVEL: ${FDI_LOG_LEVEL}
  FDI_WORKER_CONCURRENCY: ${FDI_WORKER_CONCURRENCY}
  FDI_ARTIFACT_URL_TTL_SECONDS: ${FDI_ARTIFACT_URL_TTL_SECONDS}
  FDI_MAX_UPLOAD_MB: ${FDI_MAX_UPLOAD_MB}
  FDI_AZURE_DI_ENDPOINT: ${FDI_AZURE_DI_ENDPOINT}
  FDI_AZURE_DI_KEY: ${FDI_AZURE_DI_KEY}
  FDI_AZURE_DI_MODEL: ${FDI_AZURE_DI_MODEL}
  FDI_AZURE_DI_API_VERSION: ${FDI_AZURE_DI_API_VERSION}
  FDI_AZURE_DI_POLLING_TIMEOUT_S: ${FDI_AZURE_DI_POLLING_TIMEOUT_S}
  FDI_GPT_ENDPOINT: ${FDI_GPT_ENDPOINT}
  FDI_GPT_KEY: ${FDI_GPT_KEY}
  FDI_GPT_DEPLOYMENT: ${FDI_GPT_DEPLOYMENT}
  FDI_GPT_MODEL: ${FDI_GPT_MODEL}
  FDI_GPT_API_VERSION: ${FDI_GPT_API_VERSION}
  FDI_EMBED_MODEL: ${FDI_EMBED_MODEL}
  FDI_EMBED_DIM: ${FDI_EMBED_DIM}
  FDI_NEO4J_URI: ${FDI_NEO4J_URI}
  FDI_NEO4J_USER: ${FDI_NEO4J_USER}
  FDI_NEO4J_PASSWORD: ${FDI_NEO4J_PASSWORD}
  FDI_MILVUS_URI: ${FDI_MILVUS_URI}
  FDI_MILVUS_COLLECTION: ${FDI_MILVUS_COLLECTION}
  FDI_ENTITY_SIM_THRESHOLD: ${FDI_ENTITY_SIM_THRESHOLD}
  # Defaulted in-place, unlike its neighbours: cors_origins is the only
  # complex-typed setting here, and pydantic-settings JSON-decodes those at
  # the source. An unset var expands to "", which is not valid JSON, so a
  # bare ${FDI_CORS_ORIGINS} fails the whole stack at boot with an opaque
  # SettingsError instead of falling back to the field's own default.
  FDI_CORS_ORIGINS: '${FDI_CORS_ORIGINS:-["http://localhost:3000"]}'
  FDI_OCR_COST_PER_PAGE_INR: ${FDI_OCR_COST_PER_PAGE_INR}
  FDI_LLM_INPUT_COST_PER_MTOK_USD: ${FDI_LLM_INPUT_COST_PER_MTOK_USD}
  FDI_LLM_OUTPUT_COST_PER_MTOK_USD: ${FDI_LLM_OUTPUT_COST_PER_MTOK_USD}
  FDI_USD_TO_INR_RATE: ${FDI_USD_TO_INR_RATE}
  FDI_EXTRACTION_SCHEMA_PATH: ${FDI_EXTRACTION_SCHEMA_PATH}
  # Sentry error monitoring (T8). Optional: unset/empty expands to "" and
  # the app's empty-is-unset env source reads it as monitoring OFF; nothing
  # at boot changes without a DSN. Set per deployment, never baked in.
  FDI_SENTRY_DSN: ${FDI_SENTRY_DSN}

x-backend-build: &backend-build
  build:
    context: ..
    dockerfile: backend/Dockerfile

services:
  postgres:
    image: postgres:18.4
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql
    ports: ["5432:5432"]
    healthcheck:
      # $$ escapes compose interpolation so the shell expands it in-container.
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  minio:
    # NOT RELEASE.2025-10-15T17-29-55Z: that release exists but was never published
    # as an image. This is the newest pullable tag, and is knowingly unpatched for
    # CVE-2025-62506. Local dev only -- never production. See spec 3.4.
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - miniodata:/data
    ports: ["9000:9000", "9001:9001"]
    healthcheck:
      # `mc`, not curl -- MinIO's UBI-micro base has no curl.
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8.8.0
    volumes:
      - redisdata:/data
    ports: ["6379:6379"]
    healthcheck:
      # grep PONG: redis-cli can exit 0 while the server is still loading.
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  rabbitmq:
    image: rabbitmq:4.3.2-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    volumes:
      - rabbitdata:/var/lib/rabbitmq
      - ./rabbitmq.conf:/etc/rabbitmq/conf.d/20-fdi.conf:ro
    ports: ["5672:5672", "15672:15672"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s

  migrate:
    <<: *backend-build
    environment: *backend-env
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    depends_on:
      postgres: {condition: service_healthy}

  api:
    <<: *backend-build
    environment: *backend-env
    ports: ["8000:8000"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      minio: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
    healthcheck:
      # Python, not curl: the image ships no curl (Task 18 dropped the apt layer).
      # urlopen raises on any non-2xx or connection failure, so a bare exit code is
      # a sufficient liveness signal.
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  worker:
    <<: *backend-build
    environment: *backend-env
    # No --concurrency flag, deliberately. Concurrency comes from
    # FDI_WORKER_CONCURRENCY -> Settings -> app.conf.worker_concurrency (Task 13).
    # A CLI flag here would be a SECOND source of truth that silently wins over the
    # env var, making FDI_WORKER_CONCURRENCY look configurable while doing nothing.
    command:
      - celery
      - -A
      - fdi.workers.app
      - worker
      - --pool=prefork
      - --loglevel=INFO
    depends_on:
      migrate: {condition: service_completed_successfully}
      minio: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "celery -A fdi.workers.app inspect ping -d celery@$$HOSTNAME"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  neo4j:
    # Pinned exactly: neo4j:latest is the CalVer line, a DIFFERENT lineage from
    # 5.26 LTS. Wired at SP-9b: NEO4J_AUTH derives from the same FDI_NEO4J_USER/
    # FDI_NEO4J_PASSWORD the app connects with -- one source of truth, not a
    # hardcoded credential that happens to agree with Settings by coincidence.
    image: neo4j:5.26.28
    environment:
      NEO4J_AUTH: ${FDI_NEO4J_USER}/${FDI_NEO4J_PASSWORD}
      # Re-exposed so the healthcheck below can expand them INSIDE the
      # container via $$ -- NEO4J_AUTH alone only reaches the neo4j process's
      # own bootstrap, it is not itself a shell-visible var to split on ``/``.
      # Same reasoning as postgres's own POSTGRES_USER/POSTGRES_PASSWORD lines
      # above, which exist for their healthcheck for the identical reason.
      FDI_NEO4J_USER: ${FDI_NEO4J_USER}
      FDI_NEO4J_PASSWORD: ${FDI_NEO4J_PASSWORD}
    volumes:
      - neo4jdata:/data
    ports: ["7474:7474", "7687:7687"]
    healthcheck:
      # $$ escapes compose interpolation so the shell expands it in-container,
      # same discipline as the postgres/worker healthchecks above. cypher-shell
      # ships in the official neo4j image (no curl needed, same reasoning as
      # minio's `mc`-based healthcheck).
      test: ["CMD-SHELL", "cypher-shell -u $${FDI_NEO4J_USER} -p $${FDI_NEO4J_PASSWORD} 'RETURN 1'"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  etcd:
    image: quay.io/coreos/etcd:v3.5.25
    command:
      - etcd
      - --advertise-client-urls=http://127.0.0.1:2379
      - --listen-client-urls=http://0.0.0.0:2379
      - --data-dir=/etcd
    volumes:
      - etcddata:/etcd

  milvus:
    # NEVER :latest -- it is months stale. And do NOT copy the master-branch
    # compose: it points at v3.0-beta. Defined at project setup; wired at
    # SP-14 (FDI_MILVUS_* added to x-backend-env at SP-14 Task 3) -- standalone
    # Milvus has no bootstrap credential of its own to thread through this
    # service block, unlike neo4j's NEO4J_AUTH, so no environment:/healthcheck
    # change was needed here, only the config wiring above app-side.
    image: milvusdb/milvus:v2.6.20
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes:
      - milvusdata:/var/lib/milvus
    ports: ["19530:19530"]
    depends_on: [etcd, minio]

  frontend:
    profiles: [ui]
    build:
      context: ../frontend
      dockerfile: ../docker/frontend.Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports: ["3000:3000"]

volumes:
  pgdata:
    driver_opts: {type: none, o: bind, device: "${COMPOSE_DATA_ROOT}/postgres"}
  miniodata:
    driver_opts: {type: none, o: bind, device: "${COMPOSE_DATA_ROOT}/minio"}
  redisdata:
    driver_opts: {type: none, o: bind, device: "${COMPOSE_DATA_ROOT}/redis"}
  rabbitdata:
    driver_opts: {type: none, o: bind, device: "${COMPOSE_DATA_ROOT}/rabbitmq"}
  neo4jdata:
    driver_opts: {type: none, o: bind, device: "${COMPOSE_DATA_ROOT}/neo4j"}
  etcddata:
    driver_opts: {type: none, o: bind, device: "${COMPOSE_DATA_ROOT}/etcd"}
  milvusdata:
    driver_opts: {type: none, o: bind, device: "${COMPOSE_DATA_ROOT}/milvus"}
